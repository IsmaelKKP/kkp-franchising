
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#073a7d">
<title>KKP | Reset Manager Password</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eff5ff,#f8fbff);color:#143e75;min-height:100vh}
header{background:#fff;border-bottom:1px solid #dbe7f6;padding:19px max(20px,calc((100vw - 1050px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}
header strong{font-size:17px}
a{color:#0864c8;text-decoration:none}
main{max-width:465px;margin:68px auto;padding:0 16px}
.panel{background:#fff;border:1px solid #d7e5f6;border-radius:18px;padding:35px;box-shadow:0 16px 44px #173d7512}
h1{font-size:29px;margin:0 0 8px}
p{color:#577392;line-height:1.6}
label{display:block;font-weight:700;margin:18px 0 7px}
input{width:100%;padding:13px 14px;border:1px solid #c6d9ef;border-radius:10px;font:inherit;color:#153d74}
input:focus{outline:2px solid #7caee8}
button{width:100%;border:0;border-radius:10px;padding:14px;background:#0868d6;color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:23px}
button:disabled{opacity:.6;cursor:wait}
.foot{text-align:center;font-size:14px;margin-top:20px}
.msg{margin-top:18px;border-radius:9px;padding:12px;background:#fff0f0;color:#a22c2c;display:none}
.msg.ok{background:#e8f8ee;color:#18633c}
@media(max-width:500px){main{margin:28px auto}.panel{padding:23px}header{padding:16px}}
</style>
</head>
<body>
<header>
<strong>KKP Lending · Manager Portal</strong>
<a href="index.html">← Homepage</a>
</header>
<main>
<section class="panel">
<h1>Set New Password</h1>
<p>Create a new password for your KKP Manager account.</p>

<form id="resetForm" style="display:none">
<label for="password">New Password</label>
<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required placeholder="At least 12 characters">

<label for="confirmPassword">Confirm New Password</label>
<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required placeholder="Re-enter new password">

<button id="saveButton" type="submit">Update Password</button>
</form>

<div id="message" class="msg" role="status" aria-live="polite"></div>
<div class="foot"><a href="manager-login.html">← Back to Manager Login</a></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="kkp-config.js"></script>
<script>
'use strict';

const config=window.KKP_SUPABASE||{};
const client=config.url&&config.anonKey&&window.supabase
 ?window.supabase.createClient(config.url,config.anonKey,{
  auth:{detectSessionInUrl:true,persistSession:false}
 })
 :null;

const message=document.getElementById('message');
const form=document.getElementById('resetForm');
const button=document.getElementById('saveButton');

let recoveryVerified=false;

function notify(text,ok=false){
 message.textContent=text;
 message.className='msg'+(ok?' ok':'');
 message.style.display='block';
}

async function initializeRecovery(){
 if(!client){
  notify('Password reset service is unavailable.');
  return;
 }

 const params=new URLSearchParams(window.location.search);
 const hash=new URLSearchParams(window.location.hash.substring(1));

 if(params.get('error')||hash.get('error')){
  notify('This reset link is invalid or expired. Please request a new one.');
  return;
 }

 try{
  if(params.get('token_hash')&&params.get('type')==='recovery'){
   const {error}=await client.auth.verifyOtp({
    token_hash:params.get('token_hash'),
    type:'recovery'
   });
   if(error)throw error;
   recoveryVerified=true;
  }else if(hash.get('access_token')&&hash.get('type')==='recovery'){
   const {error}=await client.auth.setSession({
    access_token:hash.get('access_token'),
    refresh_token:hash.get('refresh_token')
   });
   if(error)throw error;
   recoveryVerified=true;
  }else if(params.get('code')){
   const {error}=await client.auth.exchangeCodeForSession(params.get('code'));
   if(error)throw error;
   recoveryVerified=true;
  }

  if(!recoveryVerified){
   notify('Open this page using the password reset link sent to your email.');
   return;
  }

  window.history.replaceState({},document.title,window.location.pathname);
  form.style.display='block';
  notify('Reset link verified. Enter your new password.',true);

 }catch(error){
  notify('This reset link is invalid or expired. Please request a new one.');
 }
}

form.addEventListener('submit',async event=>{
 event.preventDefault();

 if(!client||!recoveryVerified)return;

 const password=document.getElementById('password').value;
 const confirm=document.getElementById('confirmPassword').value;

 if(password!==confirm){
  notify('Passwords do not match.');
  return;
 }

 if(password.length<12){
  notify('Password must contain at least 12 characters.');
  return;
 }

 button.disabled=true;
 button.textContent='Updating…';

 try{
  const {error}=await client.auth.updateUser({password});
  if(error){
   notify('Unable to update password. Please request a new reset link.');
   return;
  }

  await client.auth.signOut();
  recoveryVerified=false;
  form.style.display='none';
  document.getElementById('password').value='';
  document.getElementById('confirmPassword').value='';
  notify('Password updated successfully! Return to Manager Login and sign in with your username and new password.',true);

 }catch(error){
  notify('Something went wrong. Please try again.');
 }finally{
  button.disabled=false;
  button.textContent='Update Password';
 }
});

initializeRecovery();
</script>
</body>
</html>
